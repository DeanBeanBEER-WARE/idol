# Modified in DeanBeanBEER-WARE/idol, see UPSTREAM.md.
[project]
name = "idol"
version = "0.1.0+mac.2"
description = "Idol: a single image to 3D Gaussians"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# upper bounds: the newest versions tested on MPS; torchvision 0.29 brings the MPS kernel of deform_conv2d (BiRefNet)
dependencies = [
    "torch>=2.5,<2.16",
    "torchvision>=0.29,<0.30",
    "transformers>=4.56,<5.23",
    "diffusers>=0.36,<0.43",
    "huggingface_hub>=0.34",
    "safetensors>=0.4",
    "tensordict>=0.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "plyfile>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
demo = ["gradio==5.49.1", "spaces"]
dev = ["ruff==0.17.3", "pytest>=9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idol"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# upstream's code is written against this classic rule set; the broader defaults of newer ruff would rewrite it
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# package __init__ files re-export the public API
"__init__.py" = ["F401"]
# the "Image.Image" return annotation names a function-local import and is never evaluated
"idol/models/birefnet.py" = ["F821"]
# upstream names the octree level `l`
"idol/models/decoder.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
